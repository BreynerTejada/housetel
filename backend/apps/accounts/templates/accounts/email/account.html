<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{ subject }}</title>
<style>
  @media (max-width: 620px) {
    .hk-pad { padding-left: 22px !important; padding-right: 22px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#FAF8F5;-webkit-text-size-adjust:100%;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;mso-hide:all;">{{ preheader }}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FAF8F5;">
  <tr>
    <td align="center" style="padding:32px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background:#FFFFFF;border:1px solid #E7E2DA;border-radius:14px;border-collapse:separate;">
        <tr>
          <td style="height:6px;line-height:6px;font-size:0;background:{{ accent }};border-radius:14px 14px 0 0;">&nbsp;</td>
        </tr>
        <tr>
          <td class="hk-pad" style="padding:26px 40px 0;font-family:'Manrope','Segoe UI',Helvetica,Arial,sans-serif;">
            <p style="margin:0;font-size:15px;line-height:1;font-weight:800;letter-spacing:-0.02em;color:#1F1C19;">
              <span style="display:inline-block;width:9px;height:9px;margin-right:7px;border-radius:3px;background:{{ accent }};"></span>Housetel
            </p>
          </td>
        </tr>
        <tr>
          <td class="hk-pad" style="padding:24px 40px 4px;font-family:'Manrope','Segoe UI',Helvetica,Arial,sans-serif;color:#1F1C19;">
            <h1 style="margin:0 0 16px;font-size:22px;line-height:1.25;font-weight:800;letter-spacing:-0.02em;color:#1F1C19;">{{ title }}</h1>
            {% for paragraph in paragraphs %}<p style="margin:0 0 14px;font-size:15px;line-height:1.65;">{{ paragraph }}</p>{% endfor %}
          </td>
        </tr>
        {% if cta_url %}
        <tr>
          <td class="hk-pad" style="padding:6px 40px 26px;font-family:'Manrope','Segoe UI',Helvetica,Arial,sans-serif;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="border-radius:8px;background:{{ accent }};">
                  <a href="{{ cta_url }}" style="display:inline-block;padding:12px 22px;font-size:15px;line-height:1.2;font-weight:700;color:#FFFFFF;text-decoration:none;border-radius:8px;">{{ cta_label }}</a>
                </td>
              </tr>
            </table>
            <p style="margin:20px 0 0;font-size:12px;line-height:1.6;color:#6E675E;">{{ fallback_label }}<br><a href="{{ cta_url }}" style="color:{{ accent }};word-break:break-all;">{{ cta_url }}</a></p>
          </td>
        </tr>
        {% endif %}
        {% if notes %}
        <tr>
          <td class="hk-pad" style="padding:18px 40px 22px;border-top:1px solid #E7E2DA;font-family:'Manrope','Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#6E675E;">
            {% for note in notes %}<p style="margin:0 0 6px;">{{ note }}</p>{% endfor %}
          </td>
        </tr>
        {% endif %}
      </table>
      <p style="margin:16px 0 0;font-family:'Manrope','Segoe UI',Helvetica,Arial,sans-serif;font-size:11px;color:#948C81;">{{ footer }}</p>
    </td>
  </tr>
</table>
</body>
</html>
